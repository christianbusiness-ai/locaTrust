name: CI

on:
  push:
    branches: [main, master, 'rule/**']
  pull_request:
    branches: [main, master]

jobs:
  server-truth-check:
    name: Check Server Source of Truth
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Enforce Server Truth Rules
        run: npm run check:rules

      - name: Scan Built Bundle for Leaks
        run: |
          npm run build
          node tests/bundleServerTruth.test.mjs
